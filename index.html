<!doctype html>
<!-- lang is replaced at boot with the resolved locale (see src/app.js). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progression</title>
  <meta name="description" content="Strength training log — aimed at beating your previous load.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111418">

  <!-- iOS / Safari standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Progression">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1 id="app-title">Progression</h1>
        <span class="sub" id="ctx-label"></span>
      </div>
      <!-- Hidden on the plan screens, which are not scoped to a week (see src/app.js). -->
      <div class="selectors" id="selectors">
        <div>
          <div class="seg-label" id="week-label"></div>
          <div class="seg" id="week-seg" role="group"></div>
        </div>
        <div>
          <div class="seg-label" id="day-label"></div>
          <div class="seg" id="day-seg" role="group"></div>
        </div>
      </div>
    </header>

    <!-- Banner: backup reminder -->
    <div class="banner hidden" id="backup-banner">
      <div class="grow">
        <strong id="backup-banner-title"></strong>
        <span id="backup-banner-body"></span>
      </div>
      <button class="btn accent act" type="button" id="backup-now"></button>
      <button class="x" type="button" id="backup-dismiss">×</button>
    </div>

    <!-- Banner: iOS install hint -->
    <div class="banner hidden" id="install-banner">
      <div class="grow">
        <strong id="install-banner-title"></strong>
        <span id="install-banner-body"></span>
      </div>
      <button class="x" type="button" id="install-dismiss">×</button>
    </div>

    <main id="content"></main>

    <footer id="app-footer"></footer>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" class="hidden">

  <script type="module" src="src/main.js"></script>
</body>
</html>
