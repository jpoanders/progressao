<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progressão</title>
  <meta name="description" content="Registro de treino de musculação — mira em bater a carga anterior.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111418">

  <!-- iOS / Safari standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Progressão">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6f8;
      --surface-2: #eaedf1;
      --border: #d6dbe1;
      --text: #111418;
      --muted: #5b6672;
      --accent: #1257d6;
      --accent-text: #ffffff;
      --danger: #b4231f;
      --hint: #0a7d3c;
      --header: #111418;
      --header-text: #ffffff;
      --radius: 12px;
      --tap: 44px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b;
        --surface: #1d2126;
        --surface-2: #262b31;
        --border: #333a42;
        --text: #f2f4f7;
        --muted: #9aa4af;
        --accent: #5a9bff;
        --accent-text: #0a0d10;
        --danger: #ff7a72;
        --hint: #56d38a;
        --header: #0d1013;
        --header-text: #f2f4f7;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout de uma coluna */
    .app { max-width: 640px; margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header);
      color: var(--header-text);
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .title-row h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
    .title-row .sub { font-size: 13px; color: #aeb6c0; }

    /* Seletores de semana / dia */
    .selectors { margin-top: 12px; display: grid; gap: 8px; }
    .seg { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .seg::-webkit-scrollbar { display: none; }
    .seg-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #aeb6c0; margin-bottom: 2px; }
    .chip {
      flex: 0 0 auto;
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0 14px;
      border: 1px solid #3a424c;
      background: transparent;
      color: var(--header-text);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      background: var(--header-text);
      color: var(--header);
      border-color: var(--header-text);
    }

    main {
      padding: 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: calc(env(safe-area-inset-bottom) + 96px);
    }

    .day-title { font-size: 15px; color: var(--muted); margin: 4px 0 14px; }

    /* Card de exercício */
    .exercise {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .ex-name { font-size: 17px; font-weight: 700; margin: 0; }
    .ex-scheme { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

    .sets { display: grid; gap: 8px; }
    .set-row {
      display: grid;
      grid-template-columns: 34px 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .set-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }

    .field { display: flex; flex-direction: column; }
    .field label { font-size: 11px; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type="text"] {
      width: 100%;
      min-height: var(--tap);
      font-size: 16px; /* >=16px evita auto-zoom no iOS */
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    /* Hint "meta a bater" + botão copiar */
    .prev {
      grid-column: 2 / 4;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--hint);
      font-variant-numeric: tabular-nums;
      margin-top: -2px;
    }
    .prev.empty { color: var(--muted); opacity: 0.7; }
    .copy-btn {
      grid-column: 4;
      min-width: var(--tap);
      min-height: var(--tap);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 8px;
    }
    .copy-btn:disabled { opacity: 0.35; cursor: default; }

    .ex-actions { margin-top: 12px; }
    .set-stepper { display: flex; align-items: center; gap: 12px; }
    .btn.step {
      min-width: 44px;
      padding: 0;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
    }
    .btn.step:disabled { opacity: 0.35; cursor: default; }
    .step-label { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }
    .btn {
      min-height: var(--tap);
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.full { width: 100%; }
    .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
    .btn.accent { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    /* Tela de corrida */
    .run { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .run h2 { margin: 0 0 6px; font-size: 18px; }
    .run .proto { font-size: 20px; font-weight: 700; margin: 12px 0 6px; line-height: 1.3; }
    .run .note { color: var(--muted); font-size: 14px; }
    .run ul { padding-left: 18px; margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .run ul li { margin: 4px 0; }
    .run ul li.active { color: var(--text); font-weight: 700; }

    /* Backup / ferramentas */
    .tools { margin-top: 20px; display: grid; gap: 10px; }
    .tools-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .tools-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Banners */
    .banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin: 0 16px 14px;
      font-size: 14px;
    }
    .banner .grow { flex: 1; }
    .banner strong { display: block; }
    .banner .x {
      min-width: 40px; min-height: 40px;
      border: none; background: transparent; color: var(--muted);
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    .banner .act { min-height: 40px; padding: 0 12px; }
    .hidden { display: none !important; }

    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 6px 16px calc(env(safe-area-inset-bottom) + 16px); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>Progressão</h1>
        <span class="sub" id="ctx-label"></span>
      </div>
      <div class="selectors">
        <div>
          <div class="seg-label">Semana</div>
          <div class="seg" id="week-seg" role="group" aria-label="Semana"></div>
        </div>
        <div>
          <div class="seg-label">Dia</div>
          <div class="seg" id="day-seg" role="group" aria-label="Dia"></div>
        </div>
      </div>
    </header>

    <!-- Banner: lembrete de backup -->
    <div class="banner hidden" id="backup-banner">
      <div class="grow"><strong>Faça um backup</strong>Exporte seu progresso em JSON de tempos em tempos.</div>
      <button class="btn accent act" id="backup-now">Exportar</button>
      <button class="x" id="backup-dismiss" aria-label="Dispensar">×</button>
    </div>

    <!-- Banner: dica de instalação iOS -->
    <div class="banner hidden" id="install-banner">
      <div class="grow"><strong>Instale na tela inicial</strong>Safari → Compartilhar → “Adicionar à Tela de Início”. Abre em tela cheia e protege seus dados.</div>
      <button class="x" id="install-dismiss" aria-label="Dispensar">×</button>
    </div>

    <main id="content"></main>

    <footer>Progressão · dados salvos localmente neste aparelho</footer>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" class="hidden">

  <script>
  "use strict";

  /* ---------------- Plano de treino (hardcoded) ---------------- */
  const PLAN = [
    {
      id: "d1", nome: "Dia 1 — Peito + superiores", exercises: [
        { id: "supino-reto",       nome: "Supino reto (barra ou halteres)", sets: 3, scheme: "3×6-8" },
        { id: "supino-inclinado",  nome: "Supino inclinado com halteres",   sets: 3, scheme: "3×8-10" },
        { id: "desenvolvimento",   nome: "Desenvolvimento com halteres",    sets: 3, scheme: "3×6-8" },
        { id: "crucifixo",         nome: "Crucifixo ou crossover",          sets: 3, scheme: "3×12-15" },
        { id: "triceps-polia",     nome: "Tríceps na polia",                sets: 3, scheme: "3×10-12" },
        { id: "elevacao-lateral",  nome: "Elevação lateral",                sets: 3, scheme: "3×12-15" },
      ]
    },
    {
      id: "d2", nome: "Dia 2 — Pernas (quadríceps)", exercises: [
        { id: "agachamento",   nome: "Agachamento livre",                    sets: 3, scheme: "3×6-8" },
        { id: "leg-press",     nome: "Leg press",                            sets: 3, scheme: "3×10-12" },
        { id: "hack-squat",    nome: "Hack squat",                           sets: 3, scheme: "3×10-12" },
        { id: "panturrilha-pe",nome: "Panturrilha em pé",                    sets: 4, scheme: "4×12-15" },
        { id: "abdominal-d2",  nome: "Abdominal (prancha/elevação pernas)",  sets: 3, scheme: "3 séries", kgOptional: true },
      ]
    },
    {
      id: "d3", nome: "Dia 3 — Costas + superiores", exercises: [
        { id: "barra-fixa",     nome: "Barra fixa ou puxada alta",     sets: 3, scheme: "3×6-10" },
        { id: "remada-curvada", nome: "Remada curvada (barra/halter)", sets: 3, scheme: "3×8-10" },
        { id: "remada-sentada", nome: "Remada sentada na polia",       sets: 3, scheme: "3×10-12" },
        { id: "face-pull",      nome: "Face pull",                     sets: 3, scheme: "3×12-15" },
        { id: "rosca-direta",   nome: "Rosca direta",                  sets: 3, scheme: "3×8-10" },
        { id: "rosca-martelo",  nome: "Rosca martelo",                 sets: 3, scheme: "3×10-12" },
      ]
    },
    {
      id: "d4", nome: "Dia 4 — Pernas (posterior)", exercises: [
        { id: "terra-romeno",     nome: "Levantamento terra romeno", sets: 3, scheme: "3×8-10" },
        { id: "cadeira-flexora",  nome: "Cadeira flexora",           sets: 3, scheme: "3×10-12" },
        { id: "cadeira-extensora",nome: "Cadeira extensora",         sets: 3, scheme: "3×12-15" },
        { id: "panturrilha-sent", nome: "Panturrilha sentado",       sets: 4, scheme: "4×12-15" },
        { id: "abdominal-d4",     nome: "Abdominal",                 sets: 3, scheme: "3 séries", kgOptional: true },
      ]
    },
  ];

  const RUNNING = {
    1: { proto: "1 min corrida leve / 2 min caminhada", reps: "6–8×", total: "~20 min" },
    2: { proto: "2 min corrida / 1 min caminhada",      reps: "6–7×", total: "" },
    3: { proto: "3 min corrida / 1 min caminhada",      reps: "5–6×", total: "" },
    4: { proto: "5 min corrida / 1 min caminhada",      reps: "4×",   total: "" },
  };

  /* ---------------- Estado / persistência ---------------- */
  const STORAGE_KEY = "progressao:v1";
  const UI_KEY = "progressao:ui";
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && typeof s === "object" && s.entries) {
          return {
            version: 1,
            lastExport: s.lastExport ?? null,
            entries: s.entries,
            setCounts: (s.setCounts && typeof s.setCounts === "object") ? s.setCounts : {},
          };
        }
      }
    } catch (e) { /* estado corrompido — recomeça limpo */ }
    return { version: 1, lastExport: null, entries: {}, setCounts: {} };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn("Falha ao salvar", e); }
  }

  let state = loadState();

  function loadUI() {
    try {
      const ui = JSON.parse(localStorage.getItem(UI_KEY)) || {};
      return {
        week: [1,2,3,4].includes(ui.week) ? ui.week : 1,
        day: ui.day || "d1", // "d1".."d4" ou "run"
        backupDismissedAt: ui.backupDismissedAt || 0,
        installDismissed: !!ui.installDismissed,
      };
    } catch (e) {
      return { week: 1, day: "d1", backupDismissedAt: 0, installDismissed: false };
    }
  }
  function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} }
  let ui = loadUI();

  /* ---------------- Helpers de dados ---------------- */
  function keyFor(week, dayId, exId, setIdx) { return `${week}|${dayId}|${exId}|${setIdx}`; }

  function getEntry(week, dayId, exId, setIdx) {
    return state.entries[keyFor(week, dayId, exId, setIdx)] || null;
  }

  // Parse tolerante: aceita vírgula decimal, ignora lixo. Retorna number ou null.
  function parseNum(raw) {
    if (raw == null) return null;
    const cleaned = String(raw).replace(",", ".").replace(/[^0-9.]/g, "");
    if (cleaned === "" || cleaned === ".") return null;
    const n = parseFloat(cleaned);
    return Number.isFinite(n) ? n : null;
  }

  // Arredonda sem artefatos de float. reps -> inteiro; kg -> até 1 casa.
  function fmt(n, isReps) {
    if (n == null || !Number.isFinite(n)) return "";
    if (isReps) return String(Math.round(n));
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : String(r);
  }

  function setEntryField(week, dayId, exId, setIdx, field, value) {
    const k = keyFor(week, dayId, exId, setIdx);
    const cur = state.entries[k] || { kg: null, reps: null };
    cur[field] = value;
    if (cur.kg == null && cur.reps == null) {
      delete state.entries[k]; // não guarda linhas vazias
    } else {
      state.entries[k] = cur;
    }
    saveState();
  }

  // "Meta a bater": ocorrência preenchida mais recente em semanas anteriores.
  function findPrevious(week, dayId, exId, setIdx) {
    for (let w = week - 1; w >= 1; w--) {
      const e = getEntry(w, dayId, exId, setIdx);
      if (e && (e.kg != null || e.reps != null)) return { week: w, ...e };
    }
    return null;
  }

  /* ---------------- Séries ajustáveis (por semana+dia+exercício) ---------- */
  const MIN_SETS = 1, MAX_SETS = 8;
  function setCountKey(week, dayId, exId) { return `${week}|${dayId}|${exId}`; }
  function clampSets(n) { return Math.min(MAX_SETS, Math.max(MIN_SETS, n)); }

  // Contagem atual de séries: valor customizado ou o padrão do plano (ex.sets).
  function getSetCount(week, dayId, ex) {
    const v = state.setCounts[setCountKey(week, dayId, ex.id)];
    return clampSets(Number.isFinite(v) ? v : ex.sets);
  }

  function changeSetCount(week, dayId, ex, delta) {
    const cur = getSetCount(week, dayId, ex);
    const next = clampSets(cur + delta);
    if (next === cur) return;

    // Ao remover, a última série some: confirma se ela tem dados e apaga a entry.
    if (next < cur) {
      const lastIdx = cur - 1;
      if (getEntry(week, dayId, ex.id, lastIdx)) {
        if (!confirm(`A ${cur}ª série de "${ex.nome}" tem dados que serão apagados. Remover mesmo assim?`)) return;
      }
      delete state.entries[keyFor(week, dayId, ex.id, lastIdx)];
    }

    const k = setCountKey(week, dayId, ex.id);
    if (next === ex.sets) delete state.setCounts[k]; // volta ao default implícito
    else state.setCounts[k] = next;

    saveState();
    render();
  }

  /* ---------------- Render ---------------- */
  const content = document.getElementById("content");
  const ctxLabel = document.getElementById("ctx-label");

  function renderSelectors() {
    const weekSeg = document.getElementById("week-seg");
    const daySeg = document.getElementById("day-seg");
    weekSeg.innerHTML = "";
    daySeg.innerHTML = "";

    [1,2,3,4].forEach((w) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = "S" + w;
      b.setAttribute("aria-pressed", String(ui.week === w));
      b.addEventListener("click", () => { ui.week = w; saveUI(); render(); });
      weekSeg.appendChild(b);
    });

    PLAN.forEach((d, i) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = "Dia " + (i + 1);
      b.setAttribute("aria-pressed", String(ui.day === d.id));
      b.addEventListener("click", () => { ui.day = d.id; saveUI(); render(); });
      daySeg.appendChild(b);
    });
    const runBtn = document.createElement("button");
    runBtn.className = "chip";
    runBtn.textContent = "Corrida";
    runBtn.setAttribute("aria-pressed", String(ui.day === "run"));
    runBtn.addEventListener("click", () => { ui.day = "run"; saveUI(); render(); });
    daySeg.appendChild(runBtn);
  }

  function makeInput(week, dayId, exId, setIdx, field, isReps, placeholder) {
    const wrap = document.createElement("div");
    wrap.className = "field";
    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.autocomplete = "off";
    input.placeholder = placeholder || (isReps ? "reps" : "kg");
    input.setAttribute("aria-label", `${isReps ? "repetições" : "carga"} série ${setIdx + 1}`);
    const e = getEntry(week, dayId, exId, setIdx);
    input.value = e ? fmt(e[field], isReps) : "";
    input.dataset.role = field;

    input.addEventListener("input", () => {
      const n = parseNum(input.value);
      setEntryField(week, dayId, exId, setIdx, field, n);
    });
    // Ao sair do campo, normaliza a exibição (arredondada).
    input.addEventListener("blur", () => {
      const cur = getEntry(week, dayId, exId, setIdx);
      input.value = cur ? fmt(cur[field], isReps) : "";
    });

    wrap.appendChild(input);
    return { wrap, input };
  }

  function renderDay(day) {
    const frag = document.createDocumentFragment();

    const dt = document.createElement("p");
    dt.className = "day-title";
    dt.textContent = day.nome;
    frag.appendChild(dt);

    day.exercises.forEach((ex) => {
      const card = document.createElement("section");
      card.className = "exercise";

      const head = document.createElement("div");
      head.className = "ex-head";
      const name = document.createElement("h2");
      name.className = "ex-name";
      name.textContent = ex.nome;
      const scheme = document.createElement("span");
      scheme.className = "ex-scheme";
      scheme.textContent = ex.scheme;
      head.appendChild(name);
      head.appendChild(scheme);
      card.appendChild(head);

      const sets = document.createElement("div");
      sets.className = "sets";

      const count = getSetCount(ui.week, day.id, ex);
      for (let s = 0; s < count; s++) {
        const row = document.createElement("div");
        row.className = "set-row";

        const n = document.createElement("div");
        n.className = "set-n";
        n.textContent = (s + 1) + "ª";
        row.appendChild(n);

        const kg = makeInput(ui.week, day.id, ex.id, s, "kg", false);
        const reps = makeInput(ui.week, day.id, ex.id, s, "reps", true);
        row.appendChild(kg.wrap);
        row.appendChild(reps.wrap);

        // botão copiar (meta a bater)
        const prevEntry = findPrevious(ui.week, day.id, ex.id, s);
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.type = "button";
        copyBtn.textContent = "copiar";
        copyBtn.setAttribute("aria-label", `Copiar valores anteriores da série ${s + 1}`);
        row.appendChild(copyBtn);

        // linha do hint
        const prev = document.createElement("div");
        prev.className = "prev";
        if (prevEntry) {
          const kgTxt = prevEntry.kg != null ? fmt(prevEntry.kg, false) + " kg" : "—";
          const repTxt = prevEntry.reps != null ? fmt(prevEntry.reps, true) : "—";
          prev.textContent = `↳ última vez (S${prevEntry.week}): ${kgTxt} × ${repTxt}`;
          copyBtn.addEventListener("click", () => {
            if (prevEntry.kg != null) {
              kg.input.value = fmt(prevEntry.kg, false);
              setEntryField(ui.week, day.id, ex.id, s, "kg", prevEntry.kg);
            }
            if (prevEntry.reps != null) {
              reps.input.value = fmt(prevEntry.reps, true);
              setEntryField(ui.week, day.id, ex.id, s, "reps", prevEntry.reps);
            }
          });
        } else {
          prev.className = "prev empty";
          prev.textContent = "↳ sem registro anterior";
          copyBtn.disabled = true;
        }

        sets.appendChild(row);
        sets.appendChild(prev);
      }

      card.appendChild(sets);

      const actions = document.createElement("div");
      actions.className = "ex-actions";
      const stepper = document.createElement("div");
      stepper.className = "set-stepper";

      const minus = document.createElement("button");
      minus.type = "button";
      minus.className = "btn step";
      minus.textContent = "−";
      minus.setAttribute("aria-label", "Remover série de " + ex.nome);
      minus.disabled = count <= MIN_SETS;
      minus.addEventListener("click", () => changeSetCount(ui.week, day.id, ex, -1));

      const label = document.createElement("span");
      label.className = "step-label";
      label.textContent = count + (count === 1 ? " série" : " séries");

      const plus = document.createElement("button");
      plus.type = "button";
      plus.className = "btn step";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "Adicionar série a " + ex.nome);
      plus.disabled = count >= MAX_SETS;
      plus.addEventListener("click", () => changeSetCount(ui.week, day.id, ex, +1));

      stepper.appendChild(minus);
      stepper.appendChild(label);
      stepper.appendChild(plus);
      actions.appendChild(stepper);
      card.appendChild(actions);

      frag.appendChild(card);
    });

    // Limpar dia
    const clearWrap = document.createElement("div");
    clearWrap.style.marginTop = "8px";
    const clearBtn = document.createElement("button");
    clearBtn.className = "btn danger full";
    clearBtn.textContent = "Limpar este dia (Semana " + ui.week + ")";
    clearBtn.addEventListener("click", () => clearDay(ui.week, day.id));
    clearWrap.appendChild(clearBtn);
    frag.appendChild(clearWrap);

    frag.appendChild(renderTools());
    return frag;
  }

  function renderRunning() {
    const frag = document.createDocumentFragment();
    const box = document.createElement("div");
    box.className = "run";
    const h = document.createElement("h2");
    h.textContent = "Corrida — walk-run progressivo";
    box.appendChild(h);

    const cur = RUNNING[ui.week];
    const proto = document.createElement("div");
    proto.className = "proto";
    proto.textContent = `${cur.proto} · ${cur.reps}`;
    box.appendChild(proto);

    if (cur.total) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "Total aproximado: " + cur.total;
      box.appendChild(note);
    }

    const ul = document.createElement("ul");
    [1,2,3,4].forEach((w) => {
      const li = document.createElement("li");
      if (w === ui.week) li.className = "active";
      const r = RUNNING[w];
      li.textContent = `Semana ${w}: ${r.proto}, ${r.reps}${r.total ? " (" + r.total + ")" : ""}`;
      ul.appendChild(li);
    });
    box.appendChild(ul);
    frag.appendChild(box);

    frag.appendChild(renderTools());
    return frag;
  }

  function renderTools() {
    const tools = document.createElement("div");
    tools.className = "tools";

    const title = document.createElement("div");
    title.className = "tools-title";
    title.textContent = "Backup";
    tools.appendChild(title);

    const row = document.createElement("div");
    row.className = "tools-row";

    const exportBtn = document.createElement("button");
    exportBtn.className = "btn accent";
    exportBtn.textContent = "Exportar JSON";
    exportBtn.addEventListener("click", exportJSON);

    const importBtn = document.createElement("button");
    importBtn.className = "btn";
    importBtn.textContent = "Importar JSON";
    importBtn.addEventListener("click", () => document.getElementById("import-file").click());

    row.appendChild(exportBtn);
    row.appendChild(importBtn);
    tools.appendChild(row);

    if (state.lastExport) {
      const info = document.createElement("div");
      info.className = "tools-title";
      info.style.textTransform = "none";
      info.style.letterSpacing = "0";
      const d = new Date(state.lastExport);
      info.textContent = "Último backup: " + d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      tools.appendChild(info);
    }

    return tools;
  }

  function render() {
    renderSelectors();
    content.innerHTML = "";
    if (ui.day === "run") {
      ctxLabel.textContent = "Semana " + ui.week + " · Corrida";
      content.appendChild(renderRunning());
    } else {
      const day = PLAN.find((d) => d.id === ui.day) || PLAN[0];
      ctxLabel.textContent = "Semana " + ui.week;
      content.appendChild(renderDay(day));
    }
    updateBanners();
    window.scrollTo(0, 0);
  }

  /* ---------------- Ações ---------------- */
  function clearDay(week, dayId) {
    const day = PLAN.find((d) => d.id === dayId);
    if (!day) return;
    const count = day.exercises.reduce((acc, ex) => {
      let c = 0;
      for (let s = 0; s < getSetCount(week, dayId, ex); s++) if (getEntry(week, dayId, ex.id, s)) c++;
      return acc + c;
    }, 0);
    // Contagens de séries customizadas também "sujam" o dia (serão resetadas).
    const hasCustomSets = day.exercises.some((ex) => state.setCounts[setCountKey(week, dayId, ex.id)] != null);
    if (count === 0 && !hasCustomSets) { alert("Este dia já está vazio."); return; }
    if (!confirm(`Limpar a Semana ${week}, ${day.nome}? Apaga ${count} registro(s) e volta as séries ao padrão. Não dá para desfazer.`)) return;
    day.exercises.forEach((ex) => {
      for (let s = 0; s < getSetCount(week, dayId, ex); s++) delete state.entries[keyFor(week, dayId, ex.id, s)];
      delete state.setCounts[setCountKey(week, dayId, ex.id)]; // volta ao padrão
    });
    saveState();
    render();
  }

  function exportJSON() {
    state.lastExport = Date.now();
    saveState();
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const today = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `progressao-backup-${today}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    render();
  }

  document.getElementById("import-file").addEventListener("change", (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== "object" || typeof data.entries !== "object" || data.entries === null) {
          throw new Error("formato inválido");
        }
        if (!confirm("Importar vai SUBSTITUIR todo o progresso atual. Continuar?")) { ev.target.value = ""; return; }
        state = {
          version: 1,
          lastExport: data.lastExport ?? null,
          entries: data.entries,
          setCounts: (data.setCounts && typeof data.setCounts === "object") ? data.setCounts : {},
        };
        saveState();
        render();
        alert("Progresso importado com sucesso.");
      } catch (e) {
        alert("Arquivo inválido. Selecione um backup JSON exportado pelo Progressão.");
      }
      ev.target.value = "";
    };
    reader.onerror = () => { alert("Não foi possível ler o arquivo."); ev.target.value = ""; };
    reader.readAsText(file);
  });

  /* ---------------- Banners ---------------- */
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function updateBanners() {
    const backup = document.getElementById("backup-banner");
    const overdue = !state.lastExport || (Date.now() - state.lastExport > WEEK_MS);
    const hasData = Object.keys(state.entries).length > 0;
    const dismissedRecently = Date.now() - ui.backupDismissedAt < WEEK_MS;
    backup.classList.toggle("hidden", !(overdue && hasData && !dismissedRecently));

    const install = document.getElementById("install-banner");
    const showInstall = isIOS() && !isStandalone() && !ui.installDismissed;
    install.classList.toggle("hidden", !showInstall);
  }

  document.getElementById("backup-now").addEventListener("click", exportJSON);
  document.getElementById("backup-dismiss").addEventListener("click", () => {
    ui.backupDismissedAt = Date.now(); saveUI(); updateBanners();
  });
  document.getElementById("install-dismiss").addEventListener("click", () => {
    ui.installDismissed = true; saveUI(); updateBanners();
  });

  /* ---------------- Boot ---------------- */
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => { /* offline-only, sem alarde */ });
    });
  }
  </script>
</body>
</html>
